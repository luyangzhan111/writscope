name: No-key tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    env:
      DEEPSEEK_API_KEY: ''
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked project
        run: uv sync --locked --python 3.12
      - name: Restore hash-verified historical evidence
        run: uv run --locked python -m scripts.public_release restore
      - name: Test offline components and release restoration
        run: uv run --locked python -m pytest -q -p no:cacheprovider
      - name: Run scripted public demo
        run: uv run --locked python -m scripts.public_release demo
      - name: Replay representative saved real evidence without new calls
        run: uv run --locked python -m scripts.public_release replay
