name: No-key tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEEPSEEK_API_KEY: ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked project
        run: uv sync --locked --python 3.12.4
      - name: Scan the explicit publication inventory and nested evidence
        run: uv run --locked python -m scripts.s4_public_release audit
      - name: Restore the S4 candidate into an independent root
        run: uv run --locked python -m scripts.s4_public_release restore --destination .work/public-s4-check
      - name: Run the explicit no-key publication suite in the recovered root
        run: uv run --locked python -m scripts.s4_public_release test --root .work/public-s4-check --report .work/public-tests.xml
      - name: Recompute nine current and two historical reports
        run: uv run --locked python -m scripts.s4_public_release verify --root .work/public-s4-check --report .work/public-replay.json
      - name: Run the current fixed-response demo without model calls
        run: uv run --locked python -m scripts.s4_public_release demo --root .work/public-s4-check --report .work/public-demo.json
