name: No-key tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked project
        run: uv sync --locked --python 3.12
      - name: Test M1 and M2a
        run: uv run --locked python -m pytest -q
