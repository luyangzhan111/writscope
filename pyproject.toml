[project]
name = "writscope"
version = "0.1.0"
description = "Reproducible compatibility fixtures for authorization-scope research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[project.scripts]
writscope-m1 = "writscope.m1:main"
writscope-m2 = "writscope.m2:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

